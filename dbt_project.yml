name: 'payments_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'payments_analytics'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  payments_analytics:
    # Staging models - ephemeral, no materialization
    staging:
      +materialized: view
      +schema: staging
      
    # Intermediate models - views for transformation logic
    intermediate:
      +materialized: view
      +schema: intermediate
      
    # Marts - fact tables, incrementally loaded
    marts:
      +materialized: table
      +schema: marts

# Seeds configuration
seeds:
  payments_analytics:
    +schema: seeds
    +quote_columns: false

# Variables for the project
vars:
  # Date range for incremental loads
  start_date: '2024-01-01'
  end_date: '2024-06-30'
