version: 2

models:
  - name: fct_payment_transactions
    description: "Core fact table for all payment transactions with full transaction lifecycle"
    columns:
      - name: transaction_id
        description: "Unique transaction identifier"
        tests:
          - unique
          - not_null
      
      - name: transaction_status
        description: "Current status of transaction"
        tests:
          - not_null
          - accepted_values:
      arguments:
              values: ['authorized', 'captured', 'settled', 'failed', 'refunded', 'cancelled']
      
      - name: order_amount
        description: "Total order value"
        tests:
          - not_null
      
      - name: transaction_date
        description: "Date of transaction"
        tests:
          - not_null
      
      - name: gmv
        description: "Gross Merchandise Value (only for settled transactions)"
      - name: merchant_id
        description: "Foreign key to merchant dimension"
        tests:
          - not_null
          - relationships:
              to: ref('dim_merchant')
              field: merchant_id
      
      - name: customer_id
        description: "Foreign key to customer dimension"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

  - name: fct_merchant_gmv_daily
    description: "Daily aggregated metrics for merchant performance and GMV trends"
    columns:
      - name: merchant_id
        description: "Merchant identifier"
        tests:
          - not_null
      
      - name: metric_date
        description: "Date of metrics"
        tests:
          - not_null
      
      - name: gmv
        description: "Daily Gross Merchandise Value"
      - name: capture_rate
        description: "Ratio of settled to authorized transactions"
      - name: fraud_rate
        description: "Ratio of fraudulent transactions"
  - name: fct_repayment_performance
    description: "BNPL installment repayment performance and default risk analysis"
    columns:
      - name: repayment_id
        description: "Unique repayment record identifier"
        tests:
          - unique
          - not_null
      
      - name: customer_id
        description: "Foreign key to customer dimension"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      
      - name: payment_status
        description: "Status of repayment"
        tests:
          - not_null
          - accepted_values:
      arguments:
              values: ['on_time', 'late', 'missed', 'upcoming']
      
      - name: customer_risk_category
        description: "Risk categorization based on payment behavior"
        tests:
          - not_null
          - accepted_values:
      arguments:
              values: ['no_risk', 'low_risk', 'medium_risk', 'high_risk', 'pending']
      
      - name: days_late
        description: "Number of days payment is late"
  - name: dim_merchant
    description: "Merchant dimension table with lifetime performance metrics"
    columns:
      - name: merchant_id
        description: "Primary key - unique merchant identifier"
        tests:
          - unique
          - not_null
      
      - name: merchant_name
        description: "Merchant business name"
        tests:
          - not_null
      
      - name: merchant_tier
        description: "Merchant classification by GMV volume"
        tests:
          - not_null
          - accepted_values:
      arguments:
              values: ['tier_1_elite', 'tier_2_high', 'tier_3_medium', 'tier_4_low']
      
      - name: total_gmv
        description: "Lifetime GMV generated by merchant"
  - name: dim_customer
    description: "Customer dimension table with lifetime value and risk metrics"
    columns:
      - name: customer_id
        description: "Primary key - unique customer identifier"
        tests:
          - unique
          - not_null
      
      - name: customer_segment
        description: "Customer value segment"
        tests:
          - not_null
          - accepted_values:
      arguments:
              values: ['premium', 'standard', 'new']
      
      - name: customer_value_tier
        description: "Lifetime value classification"
        tests:
          - not_null
          - accepted_values:
      arguments:
              values: ['vip', 'high_value', 'medium_value', 'low_value', 'no_purchases']
      
      - name: repayment_risk_tier
        description: "Risk classification based on payment behavior"
        tests:
          - not_null
          - accepted_values:
      arguments:
              values: ['low_risk', 'medium_risk', 'high_risk', 'no_bnpl_history']
      
      - name: on_time_payment_rate
        description: "Percentage of on-time repayments"
# Custom tests for data quality
tests:
  - name: test_gmv_consistency
    description: "Ensure GMV in fct_payment_transactions matches fct_merchant_gmv_daily"
    query: |
      with transaction_gmv as (
        select
          transaction_date,
          sum(gmv) as total_gmv
        from {{ ref('fct_payment_transactions') }}
        group by 1
      ),
      
      daily_gmv as (
        select
          metric_date,
          sum(gmv) as total_gmv
        from {{ ref('fct_merchant_gmv_daily') }}
        group by 1
      )
      
      select
        t.transaction_date,
        abs(t.total_gmv - d.total_gmv) as gmv_difference
      from transaction_gmv t
      inner join daily_gmv d on t.transaction_date = d.metric_date
      where abs(t.total_gmv - d.total_gmv) > 0.01
